name: Fetch Trusted Shops Data
on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2 AM UTC
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Trusted Shops data
        run: |
          node .github/scripts/fetch-trustedshops.js
        env:
          TRUSTED_SHOPS_CLIENT_ID: ${{ secrets.TRUSTED_SHOPS_CLIENT_ID }}
          TRUSTED_SHOPS_CLIENT_SECRET: ${{ secrets.TRUSTED_SHOPS_CLIENT_SECRET }}
          TRUSTED_SHOPS_CHANNEL_ID: ${{ secrets.TRUSTED_SHOPS_CHANNEL_ID }}

      - name: Commit updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add apps/web/public/trustedshops-data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Trusted Shops data [skip ci]"
          git push